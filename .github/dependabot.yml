# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Minor and patch bumps are grouped into one PR per ecosystem to keep the review
# load low. Majors are deliberately left ungrouped: a group scoped to
# `update-types: [minor, patch]` excludes them, so each major arrives on its own
# and gets read on its own.

version: 2
updates:
  # Owns the action pins in ci.yml and release-mcp.yml. The immediate reason
  # this exists: actions/checkout@v4 targets a deprecated Node 20 runtime, and
  # that bump should arrive as a reviewed PR rather than living in someone's
  # memory. Note that release-mcp.yml is the workflow npm's trusted publisher is
  # registered against — re-run its rehearsal before merging a bump that touches
  # it (see packages/mcp/README, "Releasing").
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]

  # `bun`, not `npm` — Dependabot treats them as separate ecosystems, and this
  # repo is a Bun workspace (bun.lock, packageManager bun@1.3.3). The Bun
  # ecosystem requires Bun >= 1.1.39.
  #
  # `directory: "/"` points at the workspace root, where package.json declares
  # the members and bun.lock resolves them. GitHub's docs do not state whether
  # the Bun ecosystem walks workspace members the way the npm one does, so this
  # is the coverage to watch: if bumps for apps/web or packages/* never appear,
  # add their paths explicitly rather than assuming they are covered.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # `vite` here is an alias, not upstream Vite. Every manifest declares it as
      # `npm:@voidzero-dev/vite-plus-core@<version>`, with a matching root
      # `overrides` entry — it is the Vite+ toolchain core, and it moves in
      # lockstep with `vite-plus` when we choose to move it, rather than on
      # upstream Vite's release schedule. Dependabot sees the bare name `vite`
      # and offers upstream releases: it proposed 0.2.4 -> 8.2.0 in #28.
      #
      # Dependabot's handling of aliased specs is undocumented, so this entry is
      # a best-evidence guess: #28 reported the dependency as `vite`, so matching
      # on that name should work. If a `vite` bump shows up regardless, then
      # ignores do not cover aliases — close it as mislabelled (see #28 for the
      # wording) and treat this comment as the standing explanation.
      - dependency-name: "vite"
